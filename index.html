<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EchoJournal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-4xl font-bold mb-2">EchoJournal <span class="text-blue-400">AI</span></h1>
        <p class="text-slate-400 mb-8">Type your thoughts. Let the AI track the vibe.</p>

        <div class="bg-slate-800 p-6 rounded-xl shadow-xl mb-8">
            <textarea id="entryContent" class="w-full bg-slate-700 p-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3" placeholder="How's your head space today?"></textarea>
            <button onclick="saveEntry()" class="mt-4 bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font-semibold transition">Analyze & Save</button>
        </div>

        <div id="stats" class="grid grid-cols-2 gap-4 mb-8">
            </div>

        <h2 class="text-xl font-semibold mb-4 text-slate-300">Recent Reflections</h2>
        <div id="feed" class="space-y-4">
            </div>
    </div>

    <script>
        async function loadData() {
            // Fetch Entries
            const res = await fetch('/entries/');
            const entries = await res.json();
            const feed = document.getElementById('feed');
            feed.innerHTML = entries.map(e => `
                <div class="bg-slate-800 p-4 rounded-lg border-l-4 ${e.sentiment_score > 0 ? 'border-green-400' : 'border-red-400'}">
                    <div class="flex justify-between mb-2">
                        <span class="text-xs text-slate-500">${new Date(e.timestamp).toLocaleDateString()}</span>
                        <span class="text-sm font-bold">${e.vibe_label}</span>
                    </div>
                    <p class="text-slate-200">${e.content}</p>
                </div>
            `).join('');

            // Fetch Stats
            const statRes = await fetch('/stats/');
            const stats = await statRes.json();
            document.getElementById('stats').innerHTML = `
                <div class="bg-slate-800 p-4 rounded-lg text-center">
                    <p class="text-slate-400 text-sm">Overall Outlook</p>
                    <p class="text-2xl font-bold">${stats.overall_outlook || 'N/A'}</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-lg text-center">
                    <p class="text-slate-400 text-sm">Average Score</p>
                    <p class="text-2xl font-bold text-blue-400">${stats.average_sentiment || 0}</p>
                </div>
            `;
        }

        async function saveEntry() {
            const content = document.getElementById('entryContent').value;
            if(!content) return;
            await fetch(`/entries/?content=${encodeURIComponent(content)}`, { method: 'POST' });
            document.getElementById('entryContent').value = '';
            loadData();
        }

        loadData();
    </script>
</body>
</html>
